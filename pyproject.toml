[project]
name = "itsp-automation-mcp"
version = "0.1.0"
description = "ITSP-Automation icin ornek MCP sunucusu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
itsp-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
